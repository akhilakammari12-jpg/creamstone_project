<!Doctype html>
<html lang="en">
    <head>
        <title> CREAM STONE </title>
        <style>
         
        *{
            margin: 2px;
            padding: 2px;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
            font-family: sans-serif;
        }
        .hero{
            min-height: 700px;
            background: url(front-ice.jpg);
            background-position:right;
            background-size:cover;
            background-repeat: no-repeat;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 98%;
            margin: auto;
            padding: 5px 0;
            border-bottom: 2px solid black;
        }
        .logo{
            width:130px;
            background-color: palevioletred;
            border-radius: 30px;
            border: 50;
        }
        nav ul{
            display: flex;
            align-items: center;
        }
        nav ul li{
            margin: 0 20px;
        }
        nav ul li a{
            font-size: 25px;
            color: black;
            text-transform: uppercase;
        }
        nav ul li a:hover{
            font-weight: 600;
            border-bottom: 2px solid black;
        }
        nav button{
            padding: 17px 45px;
            border: 2px solid #8b131f;
            color: black;
            background: transparent;
            font-size: 25px;
            font-weight: 650;
            cursor: pointer;
        }
        nav button:hover{
            box-shadow: 0 0 20px black;
            scale: .8;
        }
        .content{
            position: absolute;
            top:30%;
            left: 98px;
        }
        h2{
            color:rgb(58, 3, 21);
            border-radius: 30px;
            font-size: 50px;
            font-weight: 600;
            text-transform: uppercase;
            background: palevoited;
        }
        p{
            color: black;
            font-size: 15px;
            margin-top: 10px;
        }
        #left-panel{
            background-color: palevioletred;
        }
        .content button{
            margin-top: 50px;
            background: palevioletred;
            color: black;
            font-size: 20px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            padding: 12px 45px;
            transition: .3s;
        }
        .content button:havour{
            scale: .8;
        }
        .content button.Know-More{
            border: 3px solid palevioletred;
            color: pink;
            background: transparent;
            margin-left: 25px;
        }
        .content button.know-more:havour{
            box-shadow: 10 15 30px #680f18;
        }
    </style>
    </head>
    <body>
        <div class="hero">
          <nav>
            <img src="logo cream.png" class="logo">
            <ul>
                <li><a href="#">Search</a></li>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Reviews</a></li>
                <li><a href="#">Help</a></li>
            </ul>
            <button>MORE</button>
          </nav>
          <div class="content">
            <h2>the story of cream stone</h2>
            <p>Savor the moment with our rich ,creamy ice cream-crafted from the finest 
              ingredients to delight your tase buds with every scoop!</p>
              <button class="Order Now">Order Now</button>
              <button class="Know-more">Know-More</button>
          </div>
        </div>
    </body>
    </html>
